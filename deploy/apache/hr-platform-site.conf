# HR Enterprise Platform — Apache httpd 2.4 site body (reference, Task 46).
# Included from a <VirtualHost>; see hr-platform.conf. Needs: mod_headers, mod_rewrite, mod_proxy, mod_proxy_http,
# mod_dir, mod_mime. Define before including:
#   Define HR_WEB_ROOT      /srv/hr/apps/web/dist        (the output of `npm run build`)
#   Define HR_API_UPSTREAM  http://127.0.0.1:4000        (the Node API; never exposed directly)
# Header values mirror deploy/security-headers.json — change both together (a test checks they match).

DocumentRoot "${HR_WEB_ROOT}"
<Directory "${HR_WEB_ROOT}">
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# --- API: same origin, proxied to Node. The API sets its own headers (strict CSP, no-store); nothing here overrides them.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass        "/api/" "${HR_API_UPSTREAM}/api/"
ProxyPassReverse "/api/" "${HR_API_UPSTREAM}/api/"
# mod_proxy appends the client address to X-Forwarded-For; the API trusts exactly one hop (TRUST_PROXY=1) or this
# proxy's address. X-Forwarded-Proto is set per vhost (https in the TLS vhost).

# --- Web: security headers on everything that is NOT the API.
<LocationMatch "^/(?!api/)">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
</LocationMatch>

# --- Caching: Vite writes only content-hashed files under /assets/, so they are immutable; the HTML shell must
# revalidate so a deploy is picked up at once.
<LocationMatch "^/assets/">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<LocationMatch "^/(?!api/|assets/)">
    Header always set Cache-Control "no-cache"
</LocationMatch>

# --- SPA fallback: client-side routes (/hrm/leave, /reset-password?token=…) are served index.html; real files and the
# API pass through. Nothing else is exposed: there is no source map in the build and no directory listing.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/api/
# A missing asset is a 404, never the HTML shell (so probes for e.g. *.map get an honest "not found").
RewriteCond %{REQUEST_URI} !^/assets/
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^ /index.html [L]
