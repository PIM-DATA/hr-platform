# HR Enterprise Platform — Apache httpd 2.4 reference virtual hosts (Task 46).
# TLS is terminated HERE; this proxy owns HSTS. The Node API listens on loopback only.
# API environment for this topology: TRUST_PROXY=1 (or TRUST_PROXY=127.0.0.1 when Apache runs on the same host).
#
#   Define HR_WEB_ROOT      /srv/hr/apps/web/dist
#   Define HR_API_UPSTREAM  http://127.0.0.1:4000
#   Define HR_SERVER_NAME   hr.example.com
#
# Server-wide (httpd.conf, not per vhost): hide the version banner on proxy-generated pages and headers.
#   ServerTokens Prod
#   ServerSignature Off

<VirtualHost *:80>
    ServerName ${HR_SERVER_NAME}
    # Plain HTTP only redirects; no application content is ever served without TLS.
    Redirect permanent / https://${HR_SERVER_NAME}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${HR_SERVER_NAME}
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/hr.example.com.crt
    SSLCertificateKeyFile /etc/ssl/private/hr.example.com.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3   # TLSv1.3 needs mod_ssl built with OpenSSL >= 1.1.1; else +TLSv1.2 only

    # HSTS belongs to the TLS-terminating layer. The API sends the same value in production; drop that copy first so a
    # proxied response carries exactly one header ("always set" alone would add a second one).
    Header onsuccess unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
    RequestHeader set X-Forwarded-Proto "https"

    Include /etc/apache2/hr-platform-site.conf
</VirtualHost>
