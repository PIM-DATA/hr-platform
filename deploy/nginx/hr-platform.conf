# HR Enterprise Platform — nginx reference server (Task 46).
# Equivalent to deploy/apache/hr-platform.conf, which is the configuration verified end-to-end in Task 46; this file is
# checked for header parity by a test but was not executed there (no nginx on the verification host). Verify your own
# deployment with: npm run ops:verify-web -- https://hr.example.com
# TLS is terminated HERE; this proxy owns HSTS. API environment: TRUST_PROXY=1 (or the proxy address).

# In the http {} block: hide the version banner.
#   server_tokens off;

server {
    listen 80;
    server_name hr.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hr.example.com;
    ssl_certificate     /etc/ssl/certs/hr.example.com.crt;
    ssl_certificate_key /etc/ssl/private/hr.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/hr/apps/web/dist;   # the output of `npm run build`
    autoindex off;
    client_max_body_size 25m;     # document uploads (DOCUMENT_MAX_FILE_MB) plus multipart overhead

    # API: same origin, proxied to Node on loopback. The API sets its own headers (strict CSP, no-store).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # exactly one HSTS header: hide the API's same-value copy, send the proxy's
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }

    # Vite writes only content-hashed files under /assets/: immutable, and a missing one is a 404 (never the HTML shell).
    location ^~ /assets/ {
        include /etc/nginx/hr-platform/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML shell and client-side routes: always revalidate so a deploy is picked up at once.
    location / {
        include /etc/nginx/hr-platform/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
